<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors (Accessible Version)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="main">
        <h1 class="center">Rock Paper Scissors (Accessible Version)</h1>        
        <p id="instructions" class="center">
            Please choose rock, paper, or scissors to play against the computer.
        </p>
        
        <section aria-labelledby="choise-hedding"> 
            <h2 id="choise-hedding">
                Make your choice.
            </h2>

            <div class="btnField">
                <button type="button" data-choice="rock" class="choice" id="rock">Rock</button>
                <button type="button" data-choice="scissors" class="choice" id="scissors">Scissors</button>
                <button type="button"  data-choice="paper" class="choice" id="paper">Paper</button>
            </div>
        </section>

        <section aria-labelledby="result-heading">
            <h2 id="result-heading">Round Result</h2>

            <div id="results" aria-live="polite">
                Make a choice to begin.
            </div>
        </section>
        
        <section aria-live="polite">
            <h2 id="score-heading">
                Score
            </h2>
            <!-- 
                <p id="score">You: 0 \ Computer: 0</p>
            -->
            <dl id="score">
                <div>
                    <dt>You: </dt>
                    <dd id="human-score">0</dd>
                </div>
                <div>
                    <dt>Computer: </dt>
                    <dd id="computer-score">0</dd>
                </div>
            </dl>

        </section>
        


        <button type="button" id="restart-button" hidden>
            Play again
        </button>
 
       
    </main>
    <script src="JavaScript.js"></script>

</body>
</html>
