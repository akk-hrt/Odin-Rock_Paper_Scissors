<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <!-- <a href="#main" class="skipLink">Skip to the main content</a> -->

        <h1 class="center">Rock Paper Scissors</h1>
        

    </header>


    <main id="main">
        
        <h2 class="center">Choose an option.</h2>
        
        <div class="btnField">
            <button class="choice" id="rock">Rock</button>
            <button class="choice" id="scissors">Scissors</button>
            <button class="choice" id="paper">Paper</button>
        </div>
        
        <div class="result" id="resultField" aria-live="polite"></div>
    </main>
    <script src="JavaScript.js"></script>

</body>
</html>
