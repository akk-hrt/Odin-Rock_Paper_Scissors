<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="main">
        <h1 class="center">Rock Paper Scissors</h1>        
        <p id="instructions" class="center">
            Let's play Rock Paper Scissors! To start, please choose rock, paper, or scissors to play against the computer.
        </p>
        
        <section aria-labelledby="choise-hedding"> 
            <h2 id="choise-hedding" class="visually-hidden">
                Make your choice.
            </h2>

            <div class="btnField">
                <button type="button" data-choice="rock" class="choice" id="rock">Rock</button>
                <button type="button" data-choice="scissors" class="choice" id="scissors">Scissors</button>
                <button type="button"  data-choice="paper" class="choice" id="paper">Paper</button>
            </div>
        </section>
<!-- 

        <section aria-atomic="true" aria-live="polite">
            <h2 class="center">Status</h2>
            <p id="action-feedback" class="center">
                You haven't started a game. Your choice will be displayed here once you make a choice.
            </p>

        </section>
         -->


        <section aria-labelledby="result-heading">
            <h2 id="result-heading" class="center" aria-live="polite" aria-atomic="true">Round Result</h2>

            <p id="results" class="center" aria-live="polite" aria-atomic="true">
                Make a choice to begin.
            </p>
        </section>
        
        <section aria-live="polite" aria-atomic="true">
            <h2 id="score-heading" class="center">
                Score
            </h2>
            <!-- 
                <p id="score">You: 0 \ Computer: 0</p>
            -->
            <dl id="score">
                <div class="score-row">
                    <dt>You</dt>
                    <dd id="human-score">0</dd>
                </div>
                <div class="score-row">
                    <dt>Computer</dt>
                    <dd id="computer-score">0</dd>
                </div>
            </dl>

        </section>
        


        <button type="button" id="restart-button" hidden>
            Play again
        </button>
 
       
    </main>
    <script src="JavaScript.js"></script>

</body>
</html>
